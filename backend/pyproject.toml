[project]
name = "pantau-infrastruktur-api"
version = "0.1.0"
description = "API portal monitoring infrastruktur"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=45,<47",
  "fastapi[standard]>=0.116,<1",
  "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
