global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - C:/ProgramData/Monitora/config/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: windows
    http_sd_configs:
      - url: http://127.0.0.1:8000/internal/prometheus/discovery/windows
        refresh_interval: 30s

  - job_name: node
    http_sd_configs:
      - url: http://127.0.0.1:8000/internal/prometheus/discovery/node
        refresh_interval: 30s

  - job_name: snmp
    metrics_path: /snmp
    params:
      auth: [office_v2]
      module: [if_mib]
    http_sd_configs:
      - url: http://127.0.0.1:8000/internal/prometheus/discovery/snmp
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9116

  - job_name: blackbox
    metrics_path: /probe
    params: {module: [http_2xx]}
    http_sd_configs:
      - url: http://127.0.0.1:8000/internal/prometheus/discovery/blackbox
        refresh_interval: 30s
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: icmp
    metrics_path: /probe
    params: {module: [icmp]}
    http_sd_configs:
      - url: http://127.0.0.1:8000/internal/prometheus/discovery/icmp
        refresh_interval: 30s
    relabel_configs: *probe_relabel

  - job_name: gateway
    metrics_path: /probe
    params: {module: [icmp]}
    http_sd_configs:
      - url: http://127.0.0.1:8000/internal/prometheus/discovery/gateway
        refresh_interval: 30s
    relabel_configs: *probe_relabel

  - job_name: internet-ip
    metrics_path: /probe
    params: {module: [icmp]}
    static_configs:
      - targets: ["1.1.1.1", "8.8.8.8"]
        labels: {dependency: external}
    relabel_configs: *probe_relabel

  - job_name: internet-dns
    metrics_path: /probe
    params: {module: [dns_udp]}
    static_configs:
      - targets: ["1.1.1.1"]
        labels: {dependency: external}
    relabel_configs: *probe_relabel

  - job_name: internet-https
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ["https://www.google.com/generate_204"]
        labels: {dependency: external}
    relabel_configs: *probe_relabel

  - job_name: pantau-network-health
    metrics_path: /internal/prometheus/network-metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]

  - job_name: vmware
    file_sd_configs:
      - files: ["C:/ProgramData/Monitora/config/file_sd/vmware*.yml"]
