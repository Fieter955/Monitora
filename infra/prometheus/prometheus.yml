global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node
    http_sd_configs:
      - url: http://backend:8000/internal/prometheus/discovery/node
        refresh_interval: 30s

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    http_sd_configs:
      - url: http://backend:8000/internal/prometheus/discovery/blackbox
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: icmp
    metrics_path: /probe
    params:
      module: [icmp]
    http_sd_configs:
      - url: http://backend:8000/internal/prometheus/discovery/icmp
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: snmp
    metrics_path: /snmp
    params:
      auth: [public_v2]
      module: [if_mib]
    http_sd_configs:
      - url: http://backend:8000/internal/prometheus/discovery/snmp
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: pantau-network-health
    metrics_path: /internal/prometheus/network-metrics
    static_configs:
      - targets: ["backend:8000"]
