# Konfigurasi Alertmanager untuk notifikasi Telegram
# Masukkan ID chat Telegram Anda pada chat_id di bawah ini.
global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, instance]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 2h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id: 000000000
        send_resolved: true
        parse_mode: HTML
        message: |-
          {{ if eq .Status "firing" }}🔥 <b>ALARM INFRASTRUKTUR (FIRING)</b>{{ else }}✅ <b>SISTEM PULIH (RESOLVED)</b>{{ end }}

          <b>Alert:</b> {{ .CommonLabels.alertname }}
          <b>Tingkat:</b> {{ if eq .CommonLabels.severity "critical" }}🔴 CRITICAL{{ else if eq .CommonLabels.severity "warning" }}⚠️ WARNING{{ else }}ℹ️ {{ .CommonLabels.severity }}{{ end }}
          {{ if .CommonLabels.instance }}<b>Target:</b> <code>{{ .CommonLabels.instance }}</code>
          {{ end }}{{ if .CommonLabels.device_name }}<b>Perangkat:</b> {{ .CommonLabels.device_name }}
          {{ end }}
          <b>Rincian:</b>
          {{ range .Alerts }}• {{ .Annotations.summary }}
          {{ if .Annotations.description }}  <i>{{ .Annotations.description }}</i>
          {{ end }}{{ end }}

inhibit_rules:
  - source_matchers: ['alertname="GangguanISP"']
    target_matchers: ['dependency="external"']
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [instance]
