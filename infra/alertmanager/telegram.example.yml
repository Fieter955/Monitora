# Copy to telegram.yml, replace the chat ID, then enable compose.telegram.example.yaml.
global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id: 000000000
        send_resolved: true
        parse_mode: HTML
        message: |-
          <b>{{ .Status | toUpper }}</b> — {{ .CommonLabels.alertname }}
          Target: {{ .CommonLabels.instance }}
          {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [instance]

