global:
  resolve_timeout: 5m

route:
  receiver: portal
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: portal

inhibit_rules:
  - source_matchers: ['alertname="GangguanISP"']
    target_matchers: ['dependency="external"']
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [instance]

