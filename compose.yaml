name: pantau-infrastruktur

services:
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      grafana:
        condition: service_healthy
    networks: [edge, internal]

  frontend:
    build:
      context: ./frontend
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Pantau Infrastruktur}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Pantau Infrastruktur}
      APP_ENV: ${APP_ENV:-development}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-docker_full}
      ENABLE_LIBRENMS: ${ENABLE_LIBRENMS:-true}
      ENABLE_VMWARE: ${ENABLE_VMWARE:-false}
      ENABLE_ADVANCED_TOPOLOGY: ${ENABLE_ADVANCED_TOPOLOGY:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,gateway}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Administrator Infrastruktur}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      DATABASE_URL: ${DATABASE_URL}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://thanos-query:9090}
      BLACKBOX_EXPORTER_URL: ${BLACKBOX_EXPORTER_URL:-http://blackbox-exporter:9115}
      LIBRENMS_URL: ${LIBRENMS_URL:-http://librenms:8000}
      LIBRENMS_API_TOKEN: ${LIBRENMS_API_TOKEN:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      NETWORK_SYNC_INTERVAL_SECONDS: ${NETWORK_SYNC_INTERVAL_SECONDS:-60}
      NETWORK_STALE_AFTER_SECONDS: ${NETWORK_STALE_AFTER_SECONDS:-180}
    expose: ["8000"]
    depends_on:
      db:
        condition: service_healthy
      thanos-query:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [internal, egress]

  network-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "network_worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      LIBRENMS_URL: ${LIBRENMS_URL:-http://librenms:8000}
      LIBRENMS_API_TOKEN: ${LIBRENMS_API_TOKEN:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      NETWORK_SYNC_INTERVAL_SECONDS: ${NETWORK_SYNC_INTERVAL_SECONDS:-60}
      NETWORK_STALE_AFTER_SECONDS: ${NETWORK_STALE_AFTER_SECONDS:-180}
    depends_on:
      backend:
        condition: service_healthy
      librenms:
        condition: service_started
    networks: [internal, egress]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  prometheus:
    image: quay.io/prometheus/prometheus:v3.11.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}
      - --web.enable-lifecycle
      - --storage.tsdb.min-block-duration=2h
      - --storage.tsdb.max-block-duration=2h
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./infra/prometheus/file_sd:/etc/prometheus/file_sd:ro
      - prometheus_data:/prometheus
    expose: ["9090"]
    networks: [internal, monitoring, egress]

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.32.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --enable-feature=utf8-strict-mode
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    expose: ["9093"]
    networks: [monitoring]

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-thanos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    expose: ["9000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T01-57-46Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-thanos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set minio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "Menunggu MinIO siap..."
          sleep 2
        done
        /usr/bin/mc mb --ignore-existing minio/thanos
        exit 0
    depends_on:
      minio:
        condition: service_healthy
    networks: [internal]

  thanos-init:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "-c", "chown -R 1001:1001 /var/thanos/store /var/thanos/compact"]
    volumes:
      - thanos_store_data:/var/thanos/store
      - thanos_compact_data:/var/thanos/compact
    network_mode: none

  thanos-sidecar:
    image: quay.io/thanos/thanos:v0.37.2
    restart: unless-stopped
    user: "65534:65534"
    command:
      - sidecar
      - --prometheus.url=http://prometheus:9090
      - --tsdb.path=/prometheus
      - --objstore.config-file=/etc/thanos/thanos.yaml
      - --http-address=0.0.0.0:10902
      - --grpc-address=0.0.0.0:10901
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-thanos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-thanos}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - prometheus_data:/prometheus
      - ./infra/thanos/thanos.yaml:/etc/thanos/thanos.yaml:ro
    expose: ["10901", "10902"]
    depends_on:
      prometheus:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks: [internal, monitoring]

  thanos-store:
    image: quay.io/thanos/thanos:v0.37.2
    restart: unless-stopped
    command:
      - store
      - --data-dir=/var/thanos/store
      - --objstore.config-file=/etc/thanos/thanos.yaml
      - --http-address=0.0.0.0:10902
      - --grpc-address=0.0.0.0:10901
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-thanos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-thanos}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - thanos_store_data:/var/thanos/store
      - ./infra/thanos/thanos.yaml:/etc/thanos/thanos.yaml:ro
    expose: ["10901", "10902"]
    depends_on:
      thanos-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks: [internal]

  thanos-query:
    image: quay.io/thanos/thanos:v0.37.2
    restart: unless-stopped
    command:
      - query
      - --http-address=0.0.0.0:9090
      - --grpc-address=0.0.0.0:10901
      - --store=thanos-sidecar:10901
      - --store=thanos-store:10901
      - --query.auto-downsampling
    expose: ["9090", "10901"]
    depends_on:
      thanos-sidecar:
        condition: service_started
      thanos-store:
        condition: service_started
    networks: [internal, monitoring]

  thanos-compact:
    image: quay.io/thanos/thanos:v0.37.2
    restart: unless-stopped
    command:
      - compact
      - --data-dir=/var/thanos/compact
      - --objstore.config-file=/etc/thanos/thanos.yaml
      - --http-address=0.0.0.0:10902
      - --retention.resolution-raw=${THANOS_RETENTION_RAW:-30d}
      - --retention.resolution-5m=${THANOS_RETENTION_5M:-180d}
      - --retention.resolution-1h=${THANOS_RETENTION_1H:-3y}
      - --wait
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-thanos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-thanos}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - thanos_compact_data:/var/thanos/compact
      - ./infra/thanos/thanos.yaml:/etc/thanos/thanos.yaml:ro
    expose: ["10902"]
    depends_on:
      thanos-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks: [internal]

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    expose: ["3000"]
    depends_on:
      thanos-query:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal, monitoring]

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$$
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:${NODE_EXPORTER_ROOTFS_MODE:-ro}
    expose: ["9100"]
    networks: [monitoring]

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    cap_add: [NET_RAW]
    volumes:
      - ./infra/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    expose: ["9115"]
    networks: [monitoring, internal, egress]

  snmp-exporter:
    image: quay.io/prometheus/snmp-exporter:v0.30.1
    restart: unless-stopped
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/etc/snmp_exporter/auth.yml
      - --config.expand-environment-variables
    environment:
      SNMP_COMMUNITY: ${SNMP_COMMUNITY}
    volumes:
      - ./infra/snmp/auth.yml:/etc/snmp_exporter/auth.yml:ro
    expose: ["9116"]
    networks: [monitoring, egress]

  telegraf-vsphere:
    image: telegraf:1.36-alpine
    profiles: [vmware]
    restart: unless-stopped
    environment:
      VSPHERE_URL: ${VSPHERE_URL:-https://esxi.example.local/sdk}
      VSPHERE_USERNAME: ${VSPHERE_USERNAME:-monitoring-readonly}
      VSPHERE_PASSWORD: ${VSPHERE_PASSWORD}
      VSPHERE_INSECURE_SKIP_VERIFY: ${VSPHERE_INSECURE_SKIP_VERIFY:-false}
    volumes:
      - ./infra/telegraf/vsphere.conf:/etc/telegraf/telegraf.conf:ro
    expose: ["9273"]
    networks: [monitoring, egress]

  librenms-db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --innodb-file-per-table=1
      - --lower-case-table-names=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: librenms
      MARIADB_USER: librenms
      MARIADB_PASSWORD: ${LIBRENMS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${LIBRENMS_DB_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Makassar}
    volumes:
      - librenms_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  librenms-redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${LIBRENMS_REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${LIBRENMS_REDIS_PASSWORD}
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  librenms-rrd-init:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "-c", "chown -R 1000:1000 /data/db /data/journal"]
    volumes:
      - librenms_rrd_data:/data/db
      - librenms_rrd_journal:/data/journal
    network_mode: none

  librenms-rrdcached:
    image: crazymax/rrdcached:1.9.0-r4
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Makassar}
      PUID: 1000
      PGID: 1000
      LOG_LEVEL: LOG_INFO
      WRITE_TIMEOUT: 1800
      WRITE_JITTER: 1800
      WRITE_THREADS: 4
      FLUSH_DEAD_DATA_INTERVAL: 3600
    volumes:
      - librenms_rrd_data:/data/db
      - librenms_rrd_journal:/data/journal
    tmpfs:
      - /var/run/rrdcached
    depends_on:
      librenms-rrd-init:
        condition: service_completed_successfully
    networks: [internal]

  librenms:
    image: librenms/librenms:26.6.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LIBRENMS_ADMIN_PORT:-8001}:8000"
    environment: &librenms-environment
      TZ: ${TZ:-Asia/Makassar}
      PUID: 1000
      PGID: 1000
      DB_HOST: librenms-db
      DB_PORT: 3306
      DB_NAME: librenms
      DB_USER: librenms
      DB_PASSWORD: ${LIBRENMS_DB_PASSWORD}
      DB_TIMEOUT: 60
      REDIS_HOST: librenms-redis
      REDIS_PASSWORD: ${LIBRENMS_REDIS_PASSWORD}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      RRDCACHED_SERVER: librenms-rrdcached:42217
    volumes:
      - librenms_data:/data
      - ./infra/librenms/pantau.yaml:/data/config/pantau.yaml:ro
    depends_on:
      librenms-db:
        condition: service_healthy
      librenms-redis:
        condition: service_healthy
      librenms-rrdcached:
        condition: service_started
    networks: [internal, egress]

  librenms-dispatcher:
    image: librenms/librenms:26.6.1
    restart: unless-stopped
    environment:
      <<: *librenms-environment
      SIDECAR_DISPATCHER: 1
      DISPATCHER_NODE_ID: dispatcher1
    volumes:
      - librenms_data:/data
      - ./infra/librenms/pantau.yaml:/data/config/pantau.yaml:ro
    depends_on:
      librenms:
        condition: service_started
    networks: [internal, egress]

networks:
  edge:
  internal:
    internal: true
  monitoring:
    internal: true
  egress:

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  minio_data:
  thanos_store_data:
  thanos_compact_data:
  librenms_db_data:
  librenms_rrd_data:
  librenms_rrd_journal:
  librenms_data:
